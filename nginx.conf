# ============================================================
#  Configuracion de Nginx para servir la aplicacion Angular (SPA)
# ============================================================
#
#  La clave es el "try_files": Angular maneja el enrutamiento del lado
#  del navegador, por lo que rutas como /inicio/citas no existen como
#  archivos en el servidor. Si Nginx no encuentra el archivo solicitado,
#  devuelve index.html para que el enrutador de Angular resuelva la ruta.
#  Sin esto, al recargar una pantalla interna se obtendria un error 404.
# ============================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresion para reducir el tamano de las respuestas.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache prolongado para los recursos estaticos con hash en el nombre.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
}

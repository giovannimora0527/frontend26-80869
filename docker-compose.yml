services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinica-frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - clinica-net

networks:
  clinica-net:
    external: true
    name: clinica_clinica-net

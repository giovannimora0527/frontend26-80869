<div class="container">
    <div class="container text-center">
        <button type="button" class="btn btn-outline-primary" (click)="saludar()">Saludar</button>
    </div>
    <div class="row">
        <div class="col">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
                Launch demo modal
            </button>

            <!-- Modal -->
            <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel"
                aria-hidden="true">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h1 class="modal-title fs-5" id="exampleModalLabel">{{ tituloPersonalizado }}</h1>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <h2>{{ tituloPersonalizado }}</h2>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-outline-danger"
                                data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" class="btn btn-outline-primary"
                                (click)="saludar2('Giovanni')">Guardar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col">
            <select class="form-select" *ngFor="let i of maxFilas">
                <option> Opcion {{ i }}</option>
            </select>
        </div>
    </div>

</div>

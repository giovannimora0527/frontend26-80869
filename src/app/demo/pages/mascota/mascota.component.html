<div class="container-fluid">
    <div class="row">
        <h4>{{titleModule}}</h4>
    </div>
    <br>
    <div class="row">
        <div class="col col-md-6">
            <input class="form-control" placeholder="Busque la mascota">
        </div>
        <div class="col col-md-6 d-flex justify-content-end">
            <button class="btn btn-outline-primary">Agregar Mascota</button>
        </div>
    </div>
    <br>
    <div class="row">
        <div class="col col-md-12">
            <div class="table table-responsive table-condensed">
                <table class="table table-stripped table-responsive table-bordered">
                    <thead>
                         <tr>
                            <th>Nombre</th>
                            <th>Edad</th>
                            <th>Fecha Registro</th>
                            <th>Nombres y Apellidos del cliente</th>
                            <th>Raza</th>
                            <th>Opciones</th>
                         </tr>
                    </thead>
                    <tbody *ngIf="listMascotas.length === 0">
                        <tr>
                            <td colspan="6" class="text-center">No hay información disponible</td>
                        </tr>
                    </tbody>
                    <tbody *ngIf="listMascotas.length > 0">
                        <tr *ngFor="let mascota of listMascotas">
                            <td class="text-center">{{ mascota.nombreMascota }}</td>
                            <td class="text-center">{{ mascota.edad }}</td>
                            <td class="text-center">{{ mascota.fechaRegistro }}</td>
                            <td class="text-center">{{ mascota.cliente?.nombres }} {{ mascota.cliente?.apellidos }}</td>
                            <td class="text-center">{{ mascota.raza?.nombre }}</td>                            
                            <td class="text-center">
                                <label>Botones de accion</label>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

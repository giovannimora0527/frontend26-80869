@for (breadcrumb of navigationList; track breadcrumb; let last = $last) {
  @if (last && breadcrumb.breadcrumbs !== false) {
    <div class="page-header">
      <div class="page-block">
        <div class="row align-items-center">
          <div class="col-md-12">
            <!--
              Ruta de migas unicamente (Inicio / Grupo / Pantalla). El titulo
              grande lo muestra cada pantalla en su propio encabezado, de modo
              que no se duplica el titulo como ocurria antes.
            -->
            <ul class="breadcrumb">
              <li class="breadcrumb-item">
                <a [routerLink]="['/inicio']"><i class="feather icon-home me-1"></i>Inicio</a>
              </li>
              @for (breadcrumb of navigationList; track breadcrumb) {
                @if (breadcrumb.type !== 'group') {
                  <li class="breadcrumb-item">
                    <span>{{ breadcrumb.title }}</span>
                  </li>
                }
              }
            </ul>
          </div>
        </div>
      </div>
    </div>
  }
}
